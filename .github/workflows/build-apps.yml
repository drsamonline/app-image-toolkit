# Build + release + deploy. One push, one pipeline, all from the same commit.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# The whole pipeline lives in the public app-builder kit, so a fix there reaches
# every app at once. Do not inline it here again.
#
# Pull requests build (and are therefore checked) but never release or deploy.

name: Build + deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  app:
    uses: drsamonline/app-builder/.github/workflows/build.yml@bbef0db943e11f1a280ac8a063b79e66b7f6d9db   # was @main; 34fa725 predates the launcher-icon step, which the APK job needs
    with:
      app_name: app-image-toolkit
      app_src: docs/play
      deploy_path: docs
    permissions:
      contents: write
      pages: write
      id-token: write

  # The kit ships an EXE, an APK and a Linux binary. This app can also be one
  # HTML file that runs from a USB stick with no server at all, so that form
  # belongs on the release too — built here rather than by hand, so it can never
  # be a version behind the other three.
  single-file:
    needs: app
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - name: Fold the app into one file
        run: python3 scripts/bundle.py
      - name: Check it is really one file
        run: |
          set -euo pipefail
          test -s dist/image-toolkit.html
          ! grep -qE '<script[^>]* src=|<link[^>]* rel="manifest"' dist/image-toolkit.html
          echo "one file, $(wc -c < dist/image-toolkit.html) bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach it to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload app-latest dist/image-toolkit.html --clobber
