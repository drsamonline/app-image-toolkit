# The proof. docs/play/imgtool.js is what the app runs, so this tests the app.
name: Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # was @v4
        with:
          node-version: "20"
      - name: The engine — sniff, strip, resize, budget
        run: node test-node.js
      - name: The app ships what it says it ships
        run: |
          set -euo pipefail
          for f in index.html app.js imgtool.js i18n.js sample.js version.js \
                   web-kit.js export-kit.js sw.js manifest.webmanifest; do
            test -s "docs/play/$f" || { echo "::error::docs/play/$f is missing or empty"; exit 1; }
          done
          for f in docs/play/*.js; do node --check "$f"; done
          echo "docs/play is complete" >> "$GITHUB_STEP_SUMMARY"

      - name: The scripts still run, and the version is in sync
        run: |
          set -euo pipefail
          python3 scripts/version.py
          git diff --exit-code -- docs/play/version.js docs/play/sw.js \
            || { echo "::error::VERSION and the shipped files disagree — run scripts/version.py and commit"; exit 1; }
          python3 scripts/bundle.py

      - name: The app in a browser
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1; then
            python3 scripts/uitest.py
          else
            echo "no browser on this runner — the browser checks were skipped, not passed" >> "$GITHUB_STEP_SUMMARY"
          fi
